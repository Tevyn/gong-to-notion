[project]
name = "gong-to-notion"
version = "0.1.0"
description = "Deterministic Gong call → Notion Customer Interactions importer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# One-off tools under scripts/ (notably the SFDC xlsx importer). The core
# importer doesn't need these; install with `uv sync --extra scripts`.
scripts = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gong_to_notion"]
